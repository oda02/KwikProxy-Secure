name: Release (disabled pending security sign-off)

# Fail-closed release placeholder for the security fork.
#
# The upstream workflow automatically installed JavaScript dependencies, published unsigned Windows
# installers on every version tag, and emitted updater metadata trusted by the
# upstream application key. This fork must not download/execute npm packages or
# publish installers until all of the following are reviewed explicitly:
#   * the exact frontend dependency lock and lifecycle scripts;
#   * the protected per-machine helper installation path and hostile IPC tests;
#   * an independent Authenticode identity for every Windows executable;
#   * a new Tauri updater key and fork-owned immutable release endpoint;
#   * pinned action commit SHAs and artifact provenance/attestations.
#
# There is intentionally no push/tag trigger and no checkout/build action here.

on:
  workflow_dispatch:

permissions: {}

jobs:
  release-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the security gate
        shell: bash
        run: |
          echo "Release publishing is disabled pending security sign-off."
          echo "No npm dependencies were installed or executed."
